<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1100" height="470" rx="14" fill="#0d1117"/>

  <text x="40" y="52" font-size="24" font-weight="700" fill="#e6edf3">Why an agent CLI can't show you an image</text>
  <text x="40" y="80" font-size="15" fill="#7d8590">The terminal supports graphics. The agent's TUI sits in the way.</text>

  <!-- Problem panel -->
  <rect x="40" y="108" width="480" height="322" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="142" font-size="15" font-weight="700" fill="#f85149">WITHOUT termpeek</text>

  <rect x="64" y="164" width="432" height="52" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="84" y="186" font-size="14" fill="#e6edf3">tool writes chart.png</text>
  <text x="84" y="206" font-size="12.5" fill="#7d8590">renderer emits kitty graphics escapes</text>

  <path d="M280 216 L280 244" stroke="#484f58" stroke-width="2" marker-end="url(#a)"/>

  <rect x="64" y="248" width="432" height="60" rx="8" fill="#0d1117" stroke="#f85149" stroke-dasharray="4 3"/>
  <text x="84" y="272" font-size="14" font-weight="600" fill="#f85149">agent TUI</text>
  <text x="84" y="294" font-size="12.5" fill="#7d8590">captures stdout · strips escapes · repaints over PTY</text>

  <path d="M280 308 L280 336" stroke="#484f58" stroke-width="2" marker-end="url(#a)"/>

  <rect x="64" y="340" width="432" height="62" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="84" y="364" font-size="14" fill="#8b949e">your screen</text>
  <text x="84" y="386" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f85149">Read image (42 KB)</text>

  <!-- Solution panel -->
  <rect x="580" y="108" width="480" height="322" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="604" y="142" font-size="15" font-weight="700" fill="#3fb950">WITH termpeek</text>

  <rect x="604" y="164" width="432" height="52" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="624" y="186" font-size="14" fill="#e6edf3">agent runs: termpeek chart.png</text>
  <text x="624" y="206" font-size="12.5" fill="#7d8590">probe once, pass an explicit protocol</text>

  <path d="M820 216 L820 244" stroke="#484f58" stroke-width="2" marker-end="url(#a)"/>

  <rect x="604" y="248" width="432" height="60" rx="8" fill="#0d1117" stroke="#3fb950"/>
  <text x="624" y="272" font-size="14" font-weight="600" fill="#3fb950">render outside the TUI</text>
  <text x="624" y="294" font-size="12.5" fill="#7d8590">tmux sidebar pane, or a separate window</text>

  <path d="M820 308 L820 336" stroke="#484f58" stroke-width="2" marker-end="url(#a)"/>

  <rect x="604" y="340" width="432" height="62" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="624" y="364" font-size="14" fill="#8b949e">your screen</text>
  <text x="624" y="386" font-size="13" fill="#3fb950">the actual image, in full pixels</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="4.5" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8 z" fill="#484f58"/>
    </marker>
  </defs>
</svg>
