<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="360" rx="14" fill="#0d1117"/>

  <text x="40" y="52" font-size="23" font-weight="700" fill="#e6edf3">Frames rendered, same clip, same flags</text>
  <text x="40" y="78" font-size="14.5" fill="#7d8590">Why termpeek never lets the renderer pick the protocol</text>

  <line x1="186" y1="104" x2="186" y2="268" stroke="#30363d" stroke-width="2"/>

  <text x="174" y="139" font-size="14" fill="#e6edf3" text-anchor="end">kitty, piped</text>
  <rect x="188" y="122" width="9" height="26" rx="2" fill="#f85149"/>
  <text x="209" y="140" font-size="14" font-weight="700" fill="#f85149">1 frame</text>

  <text x="174" y="199" font-size="14" fill="#e6edf3" text-anchor="end">kitty, real tty</text>
  <rect x="188" y="182" width="660" height="26" rx="2" fill="#3fb950"/>
  <text x="862" y="200" font-size="14" font-weight="700" fill="#3fb950">75 frames</text>

  <text x="174" y="259" font-size="14" fill="#e6edf3" text-anchor="end">quarter blocks</text>
  <rect x="188" y="242" width="651" height="26" rx="2" fill="#58a6ff"/>
  <text x="853" y="260" font-size="14" font-weight="700" fill="#58a6ff">74 frames</text>

  <text x="40" y="308" font-size="13.5" fill="#7d8590">Given no answer to its pixel-size query, timg renders a single frame and exits 0 — success, to any caller checking</text>
  <text x="40" y="330" font-size="13.5" fill="#7d8590">the status code. termpeek probes once and always passes an explicit protocol flag.</text>
</svg>
