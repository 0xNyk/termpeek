<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#11161f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="screen">
      <rect x="690" y="112" width="520" height="234"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- wordmark -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="#e6edf3" font-size="72" font-weight="700"
          letter-spacing="-2">termpeek</text>
    <rect x="74" y="168" width="132" height="4" rx="2" fill="url(#accent)"/>

    <text x="72" y="222" fill="#adbac7" font-size="25" font-weight="500">Your agent can see the image.</text>
    <text x="72" y="256" fill="#adbac7" font-size="25" font-weight="500">Now you can too.</text>

    <!-- Keep both lines inside x &lt; 690 or they run under the terminal mock. -->
    <text x="72" y="300" fill="#7d8590" font-size="16">Images · video · PDFs · diffs · X posts</text>
    <text x="72" y="324" fill="#7d8590" font-size="16">Claude Code · Codex · Hermes · any MCP client</text>
  </g>

  <!-- command line -->
  <g font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="17">
    <rect x="72" y="348" width="452" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="92" y="376" fill="#3fb950">$</text>
    <text x="112" y="376" fill="#e6edf3">termpeek out/render.mp4</text>
  </g>

  <!-- terminal mock -->
  <g filter="url(#shadow)">
    <rect x="690" y="78" width="520" height="268" rx="12" fill="#161b22" stroke="#30363d"/>
    <path d="M 690 90 a 12 12 0 0 1 12 -12 h 496 a 12 12 0 0 1 12 12 v 22 h -520 z"
          fill="#1c2230"/>
    <circle cx="712" cy="95" r="5.5" fill="#ff5f57"/>
    <circle cx="731" cy="95" r="5.5" fill="#febc2e"/>
    <circle cx="750" cy="95" r="5.5" fill="#28c840"/>
    <text x="950" y="100" fill="#7d8590" font-size="12"
          font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" text-anchor="middle">termpeek — sidebar</text>
    <g font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" clip-path="url(#screen)">
      <text x="716" y="122" fill="#7d8590" font-size="11">[termpeek] p95 latency by region</text>
      <text x="794" y="155" fill="#adbac7" font-size="12" text-anchor="end">us-east-1</text>
      <rect x="806" y="140" width="155" height="22" rx="4" fill="#3b82f6"/>
      <text x="971" y="155" fill="#e6edf3" font-size="12" font-weight="600">118</text>
      <text x="794" y="195" fill="#adbac7" font-size="12" text-anchor="end">us-west-2</text>
      <rect x="806" y="180" width="137" height="22" rx="4" fill="#3b82f6"/>
      <text x="953" y="195" fill="#e6edf3" font-size="12" font-weight="600">104</text>
      <text x="794" y="235" fill="#adbac7" font-size="12" text-anchor="end">eu-west-1</text>
      <rect x="806" y="220" width="326" height="22" rx="4" fill="#f97316"/>
      <text x="1142" y="235" fill="#e6edf3" font-size="12" font-weight="600">247</text>
      <text x="794" y="275" fill="#adbac7" font-size="12" text-anchor="end">ap-south-1</text>
      <rect x="806" y="260" width="215" height="22" rx="4" fill="#3b82f6"/>
      <text x="1031" y="275" fill="#e6edf3" font-size="12" font-weight="600">163</text>
    </g>
  </g>
</svg>
