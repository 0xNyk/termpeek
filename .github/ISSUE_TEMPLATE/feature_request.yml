name: Feature request
description: Suggest a capability or a new agent integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered
