name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 lib/*.sh scripts/* install.sh tests/run.sh hooks/claude-code/*.sh

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install renderers
        run: sudo apt-get update -qq && sudo apt-get install -y chafa ffmpeg bat poppler-utils jq
      - name: run tests
        run: ./tests/run.sh

  # macOS ships bash 3.2, where an empty array under `set -u` is fatal. That
  # difference has already broken this project once, so it gets its own job.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install renderers
        run: brew install chafa timg bat git-delta
      - name: confirm bash 3.2 is what we are testing against
        run: /bin/bash --version | head -1
      - name: run tests under system bash
        run: /bin/bash ./tests/run.sh
